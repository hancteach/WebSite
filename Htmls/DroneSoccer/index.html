<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>無人機足球製作紀錄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：左側版本時間軸（桌機固定、手機改為橫向捲動列）＋右側各版本截圖格線；點圖放大檢視。兩隊球門的紅、藍分別代表「製作過程」與「測試驗證」 */
:root {
  --bg: #eef1f6; --surface: #ffffff; --ink: #121826; --muted: #586377; --line: #d6dce7;
  --make: #2a63d4; --test: #cf3a40; --chip: #e3e8f1; --shade: rgba(10, 14, 22, .92);
  --f-display: "Chakra Petch", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0c1017; --surface: #151b26; --ink: #e7ebf3; --muted: #97a1b3; --line: #262e3d; --make: #5d8cff; --test: #ff5d63; --chip: #1e2633; --shade: rgba(4, 6, 10, .94); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0c1017; --surface: #151b26; --ink: #e7ebf3; --muted: #97a1b3; --line: #262e3d; --make: #5d8cff; --test: #ff5d63; --chip: #1e2633; --shade: rgba(4, 6, 10, .94); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 36px 64px; }
header.top { display: grid; gap: 14px; margin-bottom: 26px; }
.kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { margin: 0; font-size: clamp(28px, 4.2vw, 44px); font-weight: 900; line-height: 1.2; text-wrap: balance; letter-spacing: .01em; }
h1 .goal { display: inline-block; width: .5em; height: .5em; border-radius: 50%; border: .12em solid var(--test); margin-right: .25em; vertical-align: .05em; }
h1 .goal + .goal { border-color: var(--make); margin-left: -.18em; }
.lede { max-width: 68ch; color: var(--muted); margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--muted); }
.facts b { font-family: var(--f-display); font-size: 22px; color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.filters button { font: inherit; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters button:focus-visible, .shot button:focus-visible, nav.toc a:focus-visible, .lb button:focus-visible { outline: 2px solid var(--make); outline-offset: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.make { background: var(--make); } .dot.test { background: var(--test); }

.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; align-items: start; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: grid; gap: 2px; border-left: 2px solid var(--line); }
nav.toc a { display: grid; gap: 0; padding: 7px 0 7px 14px; margin-left: -2px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 13px; line-height: 1.35; }
nav.toc a .v { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--ink); }
nav.toc a.on { border-left-color: var(--test); color: var(--ink); }
nav.toc a.on .v { color: var(--test); }

section.ch { padding-top: 8px; margin-bottom: 52px; scroll-margin-top: 20px; }
.ch-head { display: grid; gap: 6px; margin-bottom: 18px; max-width: 78ch; }
.ver { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ver .v { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: .02em; padding-bottom: 4px; background: linear-gradient(90deg, var(--test) 0 50%, var(--make) 50% 100%) left bottom / 100% 3px no-repeat; }
.ver .t { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
h2 { margin: 0; font-size: 21px; font-weight: 700; text-wrap: balance; }
.ch-head p { margin: 0; color: var(--muted); }
.count { font-size: 12px; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
figure.shot { margin: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
figure.shot[hidden] { display: none; }
.shot button { all: unset; cursor: zoom-in; display: block; position: relative; border-radius: 6px; overflow: hidden; background: var(--chip); aspect-ratio: 16 / 9; max-width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
.shot button:hover img { transform: scale(1.03); }
.tag { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #fff; padding: 2px 8px; border-radius: 3px; }
.tag.make { background: var(--make); } .tag.test { background: var(--test); }
figcaption { font-size: 13.5px; line-height: 1.55; color: var(--ink); }

/* 放大檢視 */
.lb { position: fixed; inset: 0; background: var(--shade); display: grid; grid-template-rows: auto 1fr auto; z-index: 50; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(12px, env(safe-area-inset-left, 0px)); color: #eef1f6; }
.lb .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--f-mono); font-size: 12px; color: #b9c2d3; }
.lb .stage { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 0; }
.lb img { max-width: 100%; max-height: 100%; margin: auto; display: block; object-fit: contain; min-height: 0; border-radius: 4px; }
.lb .imgbox { height: 100%; min-height: 0; display: grid; }
.lb button { font: inherit; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; width: 44px; height: 44px; font-size: 20px; cursor: pointer; }
.lb button:hover { background: rgba(255,255,255,.2); }
.lb .cap { max-width: 900px; margin: 10px auto 0; text-align: center; font-size: 15px; line-height: 1.6; }
.lb .cap small { display: block; font-family: var(--f-mono); font-size: 11px; color: #9aa4b6; margin-top: 4px; }
footer { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 80ch; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  nav.toc { position: static; display: flex; overflow-x: auto; border-left: 0; border-bottom: 2px solid var(--line); gap: 4px; }
  nav.toc a { border-left: 0; border-bottom: 2px solid transparent; margin: 0 0 -2px; padding: 6px 10px; white-space: nowrap; }
  nav.toc a .n { display: none; }
  nav.toc a.on { border-bottom-color: var(--test); }
  .lb .stage { grid-template-columns: minmax(0, 1fr); }
  .lb .stage > button { display: none; }
}
@media (prefers-reduced-motion: reduce) { .shot img { transition: none; } html { scroll-behavior: auto; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker">05_遊戲 / 20261016_無人機足球模擬_Web</div>
    <h1><span class="goal"></span><span class="goal"></span>無人機足球模擬系統　製作與測試紀錄</h1>
    <p class="lede">從第 5 階段到 v0.10.0 的開發過程與驗證截圖。這些畫面都是在雲端用無頭瀏覽器（沒有顯示卡，以軟體算圖）實際操作時拍下的；藍色標籤是製作過程中的成果與調整，紅色標籤是測試驗證時的畫面。點圖片可以放大，用左右鍵切換。</p>
    <div class="facts" id="facts"></div>
    <div class="filters" role="group" aria-label="篩選">
      <button id="f-all" data-f="all" aria-pressed="true">全部</button>
      <button id="f-make" data-f="make" aria-pressed="false"><span class="dot make"></span>製作過程</button>
      <button id="f-test" data-f="test" aria-pressed="false"><span class="dot test"></span>測試驗證</button>
    </div>
  </header>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="版本"></nav>
    <main id="main"></main>
  </div>
  <footer>截圖整理於 2026-10-17。原始畫面解析度多為 1280×720 或 1120×630；放大檢視為縮小到 1600 px 寬的版本。軟體算圖每秒只有約 1～4 張畫面，實際顯示卡上的流暢度請以教室電腦「設定 → 畫面」的 FPS 為準。</footer>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="截圖放大檢視">
  <div class="bar"><span id="lbPos"></span><button id="lbClose" aria-label="關閉">✕</button></div>
  <div class="stage">
    <button id="lbPrev" aria-label="上一張">‹</button>
    <div class="imgbox"><img id="lbImg" alt=""></div>
    <button id="lbNext" aria-label="下一張">›</button>
  </div>
  <div class="cap" id="lbCap"></div>
</div>

"ver": "v0.8.0", "title": "Blender 觀眾與高畫質 GTAO、多光源陰影", "time": "10/17 09:14–09:26", "summary": "觀眾換成 Blender 製作的三種坐姿人形；高畫質加入 GTAO 環境光遮蔽與兩盞會投影的聚光燈。", "items": [{"f": "v08-01", "cat": "make", "cap": "三種坐姿觀眾原型（雙手放膝、前傾、舉手揮動）。", "src": "shots/crowd_prev.png", "w": 1100, "h": 600}, {"f": "v08-02", "cat": "make", "cap": "高畫質看台：上衣依隊色與隨機配色。", "src": "shots/v8_high_crowd.png", "w": 1280, "h": 720}, {"f": "v08-03", "cat": "make", "cap": "高畫質：GTAO 讓座椅與人物之間出現接觸暗部。", "src": "shots/v8_high_crowd2.png", "w": 1280, "h": 720}, {"f": "v08-04", "cat": "make", "cap": "同一角度的標準畫質（沒有 GTAO），可與上一張對照。", "src": "shots/v8_medium_crowd2.png", "w": 1280, "h": 720}, {"f": "v08-05", "cat": "make", "cap": "高畫質：球機在地上有三道不同方向的格狀影子。", "src": "shots/v8b_high_top.png", "w": 1280, "h": 720}, {"f": "v08-06", "cat": "test", "cap": "標準與高畫質的影子對照。", "src": "shots/top_cmp.png", "w": 960, "h": 1080}]}, {"id": "v09", "ver": "v0.9.0", "title": "攻擊手規則與自訂隊色", "time": "10/17 11:01–11:06", "summary": "新增「僅攻擊手可得分」開關與攻擊手人數（1～2 名）；攻擊手整圈腰帶燈改亮黃色；隊色可在裁判台自訂，比賽中也能改。", "items": [{"f": "v09-01", "cat": "make", "cap": "攻擊手（藍 2）亮黃色腰帶燈、名牌加 ★，和一般隊員（紅 4）明顯不同。", "src": "shots/v9_def_close1.png", "w": 1280, "h": 720}, {"f": "v09-02", "cat": "test", "cap": "每隊 2 名攻擊手的實測：右側名單「★攻」、雷達黃圈。", "src": "shots/v9_def_cmp.png", "w": 960, "h": 1080}, {"f": "v09-03", "cat": "test", "cap": "比賽進行中把隊色改成綠 / 紫：球門燈環、座椅、觀眾上衣、計分板立即換色。", "src": "shots/v9_custom_wide.png", "w": 1280, "h": 720}, {"f": "v09-04", "cat": "make", "cap": "裁判台的隊色卡片。", "src": "shots/v9_admin_colors.png", "w": 538, "h": 140}, {"f": "v09-05", "cat": "test", "cap": "兩隊選了相近的綠色時，裁判台顯示提醒。", "src": "shots/v9_admin_warn.png", "w": 538, "h": 167}]}, {"id": "v010", "ver": "v0.10.0", "title": "外觀主題（Mod）系統", "time": "10/17 13:28–14:40", "summary": "三個內建主題（寫實、賽璐珞、繽紛潑漆）可隨時切換；卡通主題使用 Q 版觀眾；進球時有潑漆或彩帶特效；可在 mods 資料夾放自製主題。", "items": [{"f": "v010-01", "cat": "make", "cap": "三種主題對照（上→下：寫實、賽璐珞、繽紛潑漆）。", "src": "shots/th_grid.png", "w": 1280, "h": 1080}, {"f": "v010-02", "cat": "make", "cap": "賽璐珞主題：平塗色塊、黑色描邊、漫畫分格介面。", "src": "shots/th_cel_close.png", "w": 1280, "h": 720}, {"f": "v010-03", "cat": "make", "cap": "繽紛潑漆主題：深紫場館、墨漬造型計分板、粉圓字體。", "src": "shots/th_inkpop_wide.png", "w": 1280, "h": 720}, {"f": "v010-04", "cat": "make", "cap": "操作手畫面：賽璐珞（上）與繽紛潑漆（下），地板有兩隊潑漆。", "src": "shots/th_station_cmp.png", "w": 960, "h": 1080}, {"f": "v010-05", "cat": "make", "cap": "繽紛潑漆主題下的裁判台。", "src": "shots/th_inkpop_admin.png", "w": 1400, "h": 1000}, {"f": "v010-06", "cat": "make", "cap": "第一版主題的問題：球門燈環過亮、地板太白、球機描邊太粗（之後修正）。", "src": "shots/th_close_cmp.png", "w": 960, "h": 1080}, {"f": "v010-07", "cat": "make", "cap": "Q 版觀眾原型：大頭圓臉、大眼睛、腮紅、短手短腳。", "src": "shots/chibi_prev.png", "w": 1100, "h": 600}, {"f": "v010-08", "cat": "make", "cap": "賽璐珞主題的 Q 版觀眾看台。", "src": "shots/chibi_cel_1.png", "w": 1280, "h": 720}, {"f": "v010-09", "cat": "make", "cap": "繽紛潑漆主題的 Q 版觀眾看台。", "src": "shots/chibi_inkpop_1.png", "w": 1280, "h": 720}, {"f": "v010-10", "cat": "make", "cap": "進球特效：繽紛潑漆的油漆噴濺（上）、賽璐珞的彩帶（下）。", "src": "shots/fx_grid.png", "w": 1280, "h": 720}, {"f": "v010-11", "cat": "test", "cap": "潑漆落地前後：藍色墨漬灑在紅方半場。", "src": "shots/fx2.png", "w": 1280, "h": 360}, {"f": "v010-12", "cat": "test", "cap": "自製主題範例「海洋」：只寫一份設定檔，其餘沿用繽紛潑漆。", "src": "shots/th_ocean.png", "w": 1280, "h": 360}]}];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CAT = { make: '製作', test: '測試' };
let filter = 'all';
const all = [];
const total = DATA.reduce((n, c) => n + c.items.length, 0);
const makeN = DATA.reduce((n, c) => n + c.items.filter(i => i.cat === 'make').length, 0);
$('facts').innerHTML = `<span><b>${DATA.length - 1}</b>個版本</span><span><b>${total}</b>張截圖</span><span><b>${makeN}</b>張製作過程</span><span><b>${total - makeN}</b>張測試驗證</span>`;
$('toc').innerHTML = DATA.map(c => `<a href="#${c.id}" data-id="${c.id}"><span class="v">${c.id === 'overview' ? '總覽' : c.ver}</span><span class="n">${esc(c.id === 'overview' ? '系統功能總覽' : c.title)}</span></a>`).join('');
$('main').innerHTML = DATA.map(c => `
  <section class="ch" id="${c.id}">
    <div class="ch-head">
      <div class="ver"><span class="v">${c.id === 'overview' ? '總覽' : c.ver}</span><span class="t">${esc(c.time)}</span><span class="count" data-count="${c.id}"></span></div>
      <h2>${esc(c.title)}</h2>
      <p>${esc(c.summary)}</p>
    </div>
    <div class="grid">${c.items.map(it => { const k = all.push({ ...it, ch: c }) - 1; return `
      <figure class="shot" data-cat="${it.cat}" data-k="${k}">
        <button type="button" aria-label="放大：${esc(it.cap)}"><img src="thumb/${it.f}.jpg" alt="${esc(it.cap)}" loading="lazy" width="640" height="360"><span class="tag ${it.cat}">${CAT[it.cat]}</span></button>
        <figcaption>${esc(it.cap)}</figcaption>
      </figure>`; }).join('')}</div>
  </section>`).join('');

function applyFilter(f) {
  filter = f;
  for (const b of document.querySelectorAll('.filters button')) b.setAttribute('aria-pressed', String(b.dataset.f === f));
  for (const el of document.querySelectorAll('figure.shot')) el.hidden = f !== 'all' && el.dataset.cat !== f;
  for (const c of DATA) {
    const n = c.items.filter(i => f === 'all' || i.cat === f).length;
    const sec = $(c.id); sec.hidden = n === 0;
    sec.querySelector('[data-count]').textContent = `${n} 張`;
    const a = document.querySelector(`#toc a[data-id="${c.id}"]`); if (a) a.hidden = n === 0;
  }
  try { localStorage.setItem('ds-gallery-filter', f); } catch {}
}
document.querySelector('.filters').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyFilter(b.dataset.f); });
let saved = 'all'; try { saved = localStorage.getItem('ds-gallery-filter') || 'all'; } catch {}
applyFilter(['all', 'make', 'test'].includes(saved) ? saved : 'all');

// 目前閱讀的版本（時間軸標示）
const io = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) for (const a of document.querySelectorAll('#toc a')) a.classList.toggle('on', a.dataset.id === e.target.id);
}, { rootMargin: '-20% 0px -70% 0px' });
for (const s of document.querySelectorAll('section.ch')) io.observe(s);

// 放大檢視
let cur = -1;
const visible = () => all.map((x, k) => k).filter(k => filter === 'all' || all[k].cat === filter);
function show(k) {
  cur = k; const it = all[k], list = visible(), pos = list.indexOf(k);
  $('lbImg').src = `img/${it.f}.jpg`; $('lbImg').alt = it.cap;
  $('lbCap').innerHTML = `${esc(it.cap)}<small>${it.ch.id === 'overview' ? '總覽' : it.ch.ver}・${CAT[it.cat]}・${esc(it.src)}</small>`;
  $('lbPos').textContent = `${pos + 1} / ${list.length}　${it.ch.id === 'overview' ? '系統功能總覽' : it.ch.ver + ' ' + it.ch.title}`;
  $('lb').hidden = false; document.body.style.overflow = 'hidden';
}
function step(d) { const list = visible(); const i = list.indexOf(cur); show(list[(i + d + list.length) % list.length]); }
function close() { $('lb').hidden = true; document.body.style.overflow = ''; const f = document.querySelector(`figure[data-k="${cur}"] button`); f?.focus(); }
$('main').addEventListener('click', e => { const f = e.target.closest('figure.shot'); if (f) show(Number(f.dataset.k)); });
$('lbPrev').onclick = () => step(-1); $('lbNext').onclick = () => step(1); $('lbClose').onclick = close;
$('lb').addEventListener('click', e => { if (e.target === $('lb') || e.target.classList.contains('imgbox')) close(); });
addEventListener('keydown', e => { if ($('lb').hidden) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
let sx = null;
$('lb').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
$('lb').addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); sx = null; });
</script>
